<!DOCTYPE html>
<html>
<head>
    <title>Admin Update Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Admin Header -->
<div class="dashboard-header">
    <h2>Admin Dashboard</h2>
</div>


<!-- Dashboard Layout -->
<div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">

        <h3>Menu</h3>

        <a href="/">
            🏠 Home
        </a>

        <a href="/admin_dashboard">
            🏠 Dashboard
        </a>

        <a href="/view_students">
            👨‍🎓 View Students
        </a>

        <a href="/admin_add_staff">
            ➕ Add Staff
        </a>

        <a href="/view_staff">
            👨‍🏫 View Staff
        </a>
    </div>


    <!-- Main Content -->
    <div class="main-content">

        <h2 class="page-title">
            Update Student
        </h2>


        <div class="container">

            <form method="POST">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ student.name }}"
                    required
                >


                <label>Mobile</label>

                <input
                    type="text"
                    name="mobile"
                    value="{{ student.mobile }}"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ student.email }}"
                    required
                >


                <label>Course</label>

                <input
                    type="text"
                    name="course"
                    value="{{ student.course }}"
                    required
                >


                <input
                    type="submit"
                    value="Update Student"
                >

            </form>

        </div>

    </div>

</div>


<!-- Footer -->
<footer>

    <p>
        &copy; 2026 Focus Computers. All Rights Reserved.
    </p>

</footer>

</body>
</html>
